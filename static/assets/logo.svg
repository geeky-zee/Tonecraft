<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Smooth, restrained transition between Cyan and Teal -->
    <linearGradient id="tc-crossbar-grad" x1="8" y1="15" x2="56" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Cutout mask for the pen nib slit and breather hole -->
    <mask id="tc-nib-mask">
      <rect width="64" height="64" fill="#FFFFFF" />
      <!-- Breather Hole -->
      <circle cx="32" cy="34" r="2.2" fill="#000000" />
      <!-- Nib Slit -->
      <rect x="31.2" y="34" width="1.6" height="17" rx="0.8" fill="#000000" />
    </mask>
  </defs>

  <!-- 1. The Craft Stem (Pen Nib) in Deep Blue -->
  <path d="M 27 20
           L 37 20
           L 37 32
           L 39.5 38
           L 32 56
           L 24.5 38
           L 27 32
           Z"
        fill="#102A43"
        mask="url(#tc-nib-mask)" />

  <!-- 2. The Dialogue Crossbar (Speech Bubble) -->
  <path d="M 14 8
           L 50 8
           A 6 6 0 0 1 56 14
           L 56 16
           A 6 6 0 0 1 50 22
           L 23 22
           Q 18 26.5 11 31
           Q 15 26 15 22
           L 14 22
           A 6 6 0 0 1 8 16
           L 8 14
           A 6 6 0 0 1 14 8
           Z"
        fill="url(#tc-crossbar-grad)" />
</svg>
